<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link rel="stylesheet" href="/form1/css/style.css">
</head>
<body>
    <h1>Reserve sua Mesa</h1>
    <p>Por favor, preencha o formulário abaixo com atenção para que possamos atendê-lo da melhor forma possível.Seja bem-vindo!</p>

  
    <div class="formulario">
          <hr>
        <form action="" method="POST">
            <div class="campo">
              
                <div class="inputs-nome">
                      <label for="nomeC">Nome Completo</label>
                    <div class="input-grupo">
                        <input type="text" id="nome" required size="40">
                        <span>Nome</span>
                    </div>
                    <div class="input-grupo">
                        <input type="text" id="sobrenome" required size="40">
                        <span>Sobrenome</span>
                    </div>

            </div>
            </div>

            <div class="campo">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="ex: myname@example.com" size="80" required>

            </div>

            <div class="campo">
                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" size="80" required>
                
            </div>
            <div class="campo">
                <label for="numeroPe">Número de Pessoas</label>
                <input type="number" id="numeroPe" size="80" required>
            </div>
            <hr>
            <div class="reserva">
                <p>Reserva</p>
            </div>
            <hr >

            <div class="campo">
                <label for="tipoReserva">Tipo de Reserva</label>
                <select name="reserva" id="reserva">
                    <option>Please Select</option>
                    <option>Restaurante (Padrão)</option>
                    <option>Grupo de amigos / Comemoração</option>
                    <option>Evento privado</option>
                    <option>Eventos temáticos</option>
                </select>
            </div>

            <div class="campo">
                <label for="outro">Se "Outro" acima, especifique</label>
                <input type="text" id="outro" size="80">
            </div>
            <div class="campo">
                <label for="pedidos">Pedidos Especiais</label>
                <input type="text" id="pedidos" required size="80">
            </div>
                <div class="botao">
                <button class="button" type="submit">Enviar</button>
            </div>
        </form>
    </div>


</body>
</html>
