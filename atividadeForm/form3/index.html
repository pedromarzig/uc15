<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-MKn5NWVBEuQXJE7TSKSgPUmMiSCmVTfCsR+VSSeQpHnoyJQZZFn/kBn+Ht5jZDPQ" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="p-3">
    <h2>Vale-Presentes</h2>
    <p>Este vale-presente será enviado para o destinatário após seu pedido ter sido pago.</p>

    <div class="d-flex flex-column gap-7">
        
        <div class="d-flex flex-row align-items-start gap-4">
            <label  class="form-label fw-bold pt-1" style="min-width: 130px;" >Seu Nome:</label>

            <div class="d-flex flex-column gap-3">
                <input type="text" aria-label="First name" class="form-control">
                <label class="form-text">Nome</label>
            </div>

            <div class="d-flex flex-column gap-3">
                <input type="text" aria-label="Middle name" class="form-control">
                <label class="form-text">Sobrenome</label>
            </div>
        </div>

        
        <div class="d-flex flex-row align-items-start gap-4">
            
            
                <label class="form-label fw-bold pt-1" style="min-width: 130px;">Seu E-mail:</label>
           <div class="d-flex flex-column gap-1" style="width: 100%; max-width: 460px;">
                <input type="email" class="form-control w-90" id="fieldText" placeholder="name@example.com">
            </div>
        </div>

        <div class="d-flex flex-row align-items-start gap-4 ">
            
            
                <label class="form-label fw-bold pt-1" style="min-width: 130px; ">E-mail do<br> Destinatário</label>
            <div class="d-flex flex-column gap-1" style="width: 100%; max-width: 460px;">
                <input type="email" class="form-control w-90" id="fieldText" placeholder="name@example.com ">
            </div>
        </div>
        
         <div class="d-flex flex-row align-items-start gap-4">

    <label class="form-label fw-bold pt-1" style="min-width: 130px;">
        Endereço do<br>Destinatário
    </label>

  
    <div class="d-flex flex-column gap-3 ">
       
        <div class="d-flex flex-column gap-1">
            <input type="text" aria-label="Rua e número " class="form-control w-90">
            <label class="form-text mt-0">Rua e número</label>
        </div>

       
        <div class="d-flex flex-column gap-1">
            <input type="text" aria-label="Bairro" class="form-control w-90 ">
            <label class="form-text mt-0">Bairro</label>
        </div>

        
        <div class="d-flex flex-row gap-3">
            <div class="d-flex flex-column gap-1 ">
                <input type="text" aria-label="Cidade" class="form-control ">
                <label class="form-text mt-0 ">Cidade</label>
            </div>
            <div class="d-flex flex-column gap-1 ">
                <input type="text" aria-label="Estado" class="form-control ">
                <label class="form-text mt-0">Estado</label>
            </div>
        </div>

        
        <div class="d-flex flex-row gap-3">
            <div class="d-flex flex-column gap-1 ">
                <input type="text" aria-label="CEP" class="form-control">
                <label class="form-text mt-0">CEP</label>
            </div>
            <div class="d-flex flex-column gap-1 w-50">
                <select aria-label="País" class="form-select">
                    <option value="BR" selected>Brazil</option>
                    <option value="PT">Portugal</option>
                    <option value="US">United States</option>
                    <option value="AR">Argentina</option>
                </select>
                <label class="form-text mt-0">País</label>
            </div>
        </div>
    </div>
</div>
<div class="d-flex flex-column gap-4 mt-4" style="max-width: 614px;">
  
    <div class="d-flex flex-column gap-2">
        <label class="form-label fw-bold mb-0">Telefone / Celular</label>
        <div class="d-flex flex-row align-items-start gap-2">
            <div class="d-flex flex-column gap-1" style="flex: 1;">
                <input type="text" id="codigoTelefone" aria-label="Código" class="form-control">
                <label for="codigoTelefone" class="form-text mt-0">Código</label>
            </div>

            <span class="pt-2 fw-bold">-</span>

            <div class="d-flex flex-column gap-1" style="flex: 1;">
                <input type="text" id="numeroTelefone" aria-label="Número" class="form-control">
                <label for="numeroTelefone" class="form-text mt-0">Número</label>
            </div>
        </div>
    </div>

    <
    <div class="d-flex flex-row align-items-center gap-4">
        <label for="temaVale" class="form-label fw-bold mb-0" style="min-width: 130px;">
            Tema do vale
        </label>
        <div style="width: 100%; max-width: 220px;">
            <select id="temaVale" class="form-select">
                <option value="" selected>Please Select</option>
                <option value="aniversario">Aniversário</option>
                <option value="natal">Natal</option>
                <option value="casamento">Casamento</option>
            </select>
        </div>
    </div>

   
    <div class="d-flex flex-row align-items-start gap-4">
        <label for="valorVale" class="form-label fw-bold pt-2 mb-0" style="min-width: 130px;">
            Valor do Vale
        </label>
        <div class="d-flex flex-column gap-1" style="width: 100%; max-width: 240px;">
            <input type="text" id="valorVale" class="form-control" placeholder="R$ 32,00">
            <label for="valorVale" class="form-text mt-0">Valor entre R$ 32,00 e R$ 1.000,00</label>
        </div>
    </div>

   
    <div class="d-flex flex-row align-items-start gap-4">
        <label for="divulgarNome" class="form-label fw-bold pt-1 mb-0" style="min-width: 130px;">
            Divulgar seu<br>Nome?
        </label>
        <div style="width: 100%; max-width: 220px;">
            <select id="divulgarNome" class="form-select">
                <option value="" selected>Please Select</option>
                <option value="sim">Sim</option>
                <option value="nao">Não</option>
            </select>
        </div>
    </div>

    
    <div class="d-flex flex-column gap-2">
        <label for="observacoes" class="form-label fw-bold mb-0">Observações:</label>
        <textarea id="observacoes" class="form-control" rows="4"></textarea>
    </div>

    
    <div class="d-flex flex-row align-items-start gap-4">
        <label for="captchaInput" class="form-label fw-bold pt-1 mb-0" style="min-width: 130px;">
            Digite a imagem
        </label>

        <div class="border rounded bg-light p-2 d-flex flex-column gap-2" style="width: 220px;">
           
            <div class="border rounded bg-white d-flex justify-content-center align-items-center" style="height: 45px;">
                <div class="spinner-border spinner-border-sm text-secondary" role="status">
                    <span class="visually-hidden">Carregando...</span>
                </div>
            </div>

            
            <div class="d-flex flex-row align-items-center gap-1">
                <input type="text" id="captchaInput" aria-label="Digite o código da imagem" class="form-control form-control-sm">
                <button type="button" class="btn btn-sm btn-link text-decoration-none p-1" title="Atualizar imagem">
                    &#x21bb;
                </button>
            </div>
        </div>
    </div>

   
    <div class="d-flex flex-row align-items-start gap-4 mt-2">
        <div style="min-width: 130px;"></div>
        <button type="submit" class="btn btn-light border px-4">Enviar</button>
    </div>
</div>
    </div>

    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-+PW0IDVGGwmpaBQvcXY+W0BcpHpITFB3dSfSoGvDdHtLbrLpSbpGcvtQRM/BJpz+" crossorigin="anonymous"></script>
</body>
</html>
