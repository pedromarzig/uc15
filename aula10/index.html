<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="cabecalho">
        <h1>Formulário</h1>
        <h2>Preencha os campos abaixo</h2>
     </div>
     <div class="formulario">
     <form action="" method="POST"> <!--POST / GET-->

        <div class="campo">
            <label for="nome">Nome Completo</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" size="40" required>

        </div>

        <div class="campo">
            <label for="cidade">Cidade </label>
            <input type="text" id="cidade" name="cidade" placeholder="Digite a cidade onde reside o usuário" size="40" required>
            
        </div>

        <div class="campo">
            <label for="email">Email </label>
            <input type="email" id="email" name="email" placeholder="Digite o email" size="40" required>
            
        </div>

        <div class="campo">
            <label for="senha">Senha </label>
            <input type="password" id="senha" name="senha" placeholder="Digite a senha" size="40"required>
            
        </div>

        <div class="campo">
            <label for="data">Data de Nascimento </label>
            <input type="date" id="data" name="data" placeholder="Digite a data de Nascimento do usuário" size="10" required>
            
        </div>


        <div class="campo">
            <label for="telefone">Telefone </label>
            <input type="tel" id="telefone" name="telefone" placeholder="(##) ####-#####" size="10" required>
            
        </div>

        <div class="campo">
            <label for="estado">Estado </label>
            <select name="estado" id="estado" >
                <option>Rio De Janeiro</option>
                <option>São Paulo</option>
                <option>Minas Gerais</option>
                <option>Ceará</option>
            </select>
            
        </div>

        <div class="campo">
            <label class="titulo-campo">Titulo de preferência </label>
            <label class="option" >
                <input type="radio" name="turno" value="manhã" required>Manhã
            </label>

            <label class="option">
                <input type="radio" name="turno" value="tarde" required>Tarde
            </label>
            <label class="option">
                <input type="radio" name="turno" value="Noite" required>Noite
            </label>           
        </div>

        <div class="campo">
            <label class="titulo-campo">Áreas de Interesse </label>
            <label class="option" >
                <input type="checkbox" name="interesses" value="tecnologia">Tecnologia
            </label>

            <label class="option">
                <input type="checkbox" name="interesses" value="design"> Design
            </label>
            <label class="option">
                <input type="checkbox" name="interesses" value="marketing"> Marketing
            </label>           
        </div>

        <div class="campo">
            <label for="obs">Observações</label>
            <textarea id="obs" name="obs" rows="4" placeholder="Escreva aqui seu comentário...."></textarea>
        </div>

        <div class="campo">
            <label for="imagem">Escolha a foto do usuário</label>
                <input type="file" id="imagem" name="imagem"  accept="image/png, image/jpeg" required >
            
        </div>

        <div class="botao">
            <button class="button" type="submit">Enviar</button>
        </div>
     </form>
     </div>

</body>
</html>
